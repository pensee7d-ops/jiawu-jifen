{% extends "base.html" %}
{% block content %}
<h1>任务管理</h1>
{% for t in tasks %}
<div class="card">
  <form method="post" action="/admin/catalog">
    <input type="hidden" name="op" value="update">
    <input type="hidden" name="task_id" value="{{ t['id'] }}">
    <input type="text" name="name" value="{{ t['name'] }}">
    <input type="number" name="points" value="{{ t['default_points'] }}">
    <label><input type="checkbox" name="is_vocab" value="1"
      {% if t['is_vocab'] %}checked{% endif %}> 计入"单词全勤"</label>
    <button>保存</button>
  </form>
  <form method="post" action="/admin/catalog">
    <input type="hidden" name="task_id" value="{{ t['id'] }}">
    {% if t['active'] %}<button name="op" value="deactivate">停用</button>
    {% else %}<button name="op" value="activate">启用</button>{% endif %}
    <span class="muted">{{ '启用中' if t['active'] else '已停用' }}</span>
  </form>
</div>
{% endfor %}
<div class="card">
  <b>新增任务</b>
  <form method="post" action="/admin/catalog">
    <input type="hidden" name="op" value="add">
    <input type="text" name="name" placeholder="任务名">
    <input type="number" name="points" placeholder="默认分">
    <label><input type="checkbox" name="is_vocab" value="1"> 单词类</label>
    <button>添加</button>
  </form>
</div>
<p><a href="/">← 回看板</a></p>
{% endblock %}
